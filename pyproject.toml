[project]
name = "vlmx-sh2"
version = "0.1.0"
description = "CLI shell for VLMX"
requires-python = ">=3.11"
dependencies = [
    "mypy",
    "pydantic",
    "sqlmodel>=0.0.29",
    "textual",
]

[project.scripts]
vlmx = "vlmx_sh2.main:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "textual-dev>=1.8.0",
]
