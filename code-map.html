<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VLMX-SH2 Code Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f1117; color: #e2e8f0; height: 100vh; overflow: hidden; }

  .layout { display: grid; grid-template-columns: 280px 1fr; grid-template-rows: 1fr auto; height: 100vh; }
  .sidebar { grid-row: 1 / 3; background: #161822; border-right: 1px solid #2d3148; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .canvas-area { position: relative; overflow: hidden; background: #1a1d2e; }
  .prompt-area { background: #161822; border-top: 1px solid #2d3148; border-left: 1px solid #2d3148; padding: 12px 16px; max-height: 200px; overflow-y: auto; }

  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: #8b92a8; margin-bottom: 8px; }
  h1 { font-size: 15px; color: #c4ccdf; margin-bottom: 4px; }
  .subtitle { font-size: 11px; color: #6b7280; }

  .section { border-bottom: 1px solid #2d3148; padding-bottom: 12px; }

  /* Presets */
  .preset-btn { display: block; width: 100%; padding: 7px 10px; margin-bottom: 4px; background: #1e2235; border: 1px solid #2d3148; border-radius: 6px; color: #c4ccdf; font-size: 12px; cursor: pointer; text-align: left; transition: all .15s; }
  .preset-btn:hover { background: #262a40; border-color: #3b82f6; }
  .preset-btn.active { background: #1e3a5f; border-color: #3b82f6; color: #93c5fd; }

  /* Checkboxes */
  .check-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; font-size: 12px; }
  .check-row input { accent-color: #3b82f6; }
  .color-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .line-sample { width: 24px; height: 2px; display: inline-block; flex-shrink: 0; border-radius: 1px; }

  /* Comments */
  .comment-item { background: #1e2235; border: 1px solid #2d3148; border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; font-size: 11px; position: relative; }
  .comment-item .target { color: #93c5fd; font-weight: 600; }
  .comment-item .file { color: #6b7280; font-size: 10px; }
  .comment-item .text { color: #c4ccdf; margin-top: 4px; }
  .comment-item .del-btn { position: absolute; top: 6px; right: 8px; background: none; border: none; color: #6b7280; cursor: pointer; font-size: 14px; line-height: 1; }
  .comment-item .del-btn:hover { color: #ef4444; }
  .no-comments { font-size: 11px; color: #6b7280; font-style: italic; }

  /* SVG canvas */
  svg { width: 100%; height: 100%; }
  .node-rect { rx: 8; ry: 8; stroke-width: 1.5; cursor: pointer; transition: filter .15s; }
  .node-rect:hover { filter: brightness(1.15); }
  .node-rect.commented { stroke-width: 2.5; stroke-dasharray: none; }
  .node-label { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #1e293b; pointer-events: none; }
  .node-sub { font-family: 'SF Mono', 'Cascadia Code', monospace; font-size: 9px; fill: #64748b; pointer-events: none; }
  .conn-line { fill: none; stroke-width: 1.5; }
  .conn-label { font-family: system-ui, sans-serif; font-size: 9px; fill: #8b92a8; pointer-events: none; }

  /* Zoom controls */
  .zoom-controls { position: absolute; top: 12px; right: 12px; display: flex; gap: 4px; }
  .zoom-btn { width: 30px; height: 30px; background: #1e2235; border: 1px solid #2d3148; border-radius: 6px; color: #c4ccdf; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .zoom-btn:hover { background: #262a40; border-color: #3b82f6; }

  /* Legend */
  .legend { position: absolute; bottom: 12px; left: 12px; background: #161822ee; border: 1px solid #2d3148; border-radius: 8px; padding: 10px 14px; font-size: 10px; display: flex; gap: 14px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; color: #8b92a8; }

  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: #000a; z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal { background: #1e2235; border: 1px solid #2d3148; border-radius: 10px; padding: 20px; width: 400px; max-width: 90vw; }
  .modal h3 { font-size: 14px; color: #c4ccdf; margin-bottom: 4px; }
  .modal .modal-file { font-size: 11px; color: #6b7280; font-family: monospace; margin-bottom: 12px; }
  .modal textarea { width: 100%; height: 80px; background: #161822; border: 1px solid #2d3148; border-radius: 6px; color: #e2e8f0; padding: 8px; font-size: 12px; font-family: system-ui; resize: vertical; }
  .modal textarea:focus { outline: none; border-color: #3b82f6; }
  .modal-actions { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }
  .modal-btn { padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; border: 1px solid #2d3148; }
  .modal-btn.primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  .modal-btn.primary:hover { background: #2563eb; }
  .modal-btn.secondary { background: #1e2235; color: #c4ccdf; }
  .modal-btn.secondary:hover { background: #262a40; }

  /* Prompt */
  .prompt-text { font-family: 'SF Mono', 'Cascadia Code', monospace; font-size: 12px; color: #c4ccdf; white-space: pre-wrap; line-height: 1.6; min-height: 24px; }
  .prompt-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .copy-btn { padding: 4px 12px; background: #1e2235; border: 1px solid #2d3148; border-radius: 6px; color: #c4ccdf; font-size: 11px; cursor: pointer; }
  .copy-btn:hover { border-color: #3b82f6; color: #93c5fd; }
  .copy-btn.copied { border-color: #10b981; color: #6ee7b7; }
</style>
</head>
<body>

<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div>
      <h1>VLMX-SH2</h1>
      <div class="subtitle">DSL Shell Architecture</div>
    </div>

    <div class="section">
      <h2>View Presets</h2>
      <div id="presets"></div>
    </div>

    <div class="section">
      <h2>Layers</h2>
      <div id="layers"></div>
    </div>

    <div class="section">
      <h2>Connections</h2>
      <div id="connTypes"></div>
    </div>

    <div>
      <h2>Comments (<span id="commentCount">0</span>)</h2>
      <div id="commentsList"><div class="no-comments">Click a component to add feedback</div></div>
    </div>
  </div>

  <!-- Canvas -->
  <div class="canvas-area" id="canvasArea">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="zoom-controls">
      <button class="zoom-btn" onclick="zoom(1.2)" title="Zoom in">+</button>
      <button class="zoom-btn" onclick="zoom(1/1.2)" title="Zoom out">&minus;</button>
      <button class="zoom-btn" onclick="resetZoom()" title="Reset">&#8634;</button>
    </div>
    <div class="legend" id="legend"></div>
  </div>

  <!-- Prompt -->
  <div class="prompt-area">
    <div class="prompt-header">
      <h2 style="margin:0">Prompt Output</h2>
      <button class="copy-btn" id="copyBtn" onclick="copyPrompt()">Copy</button>
    </div>
    <div class="prompt-text" id="promptText">Adjust layers and add comments to generate a prompt.</div>
  </div>
</div>

<!-- Comment Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div class="modal-file" id="modalFile"></div>
    <textarea id="modalText" placeholder="Add your feedback or request about this component..."></textarea>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeModal()">Cancel</button>
      <button class="modal-btn primary" onclick="saveComment()">Save</button>
    </div>
  </div>
</div>

<script>
// ── Data ──────────────────────────────────────────────

const LAYERS = {
  ui:       { label: 'UI / Presentation', color: '#dbeafe', stroke: '#3b82f6' },
  engine:   { label: 'Engine',            color: '#fef3c7', stroke: '#f59e0b' },
  parser:   { label: 'Parser Pipeline',   color: '#f3e8ff', stroke: '#a855f7' },
  ir:       { label: 'IR / Words',        color: '#dcfce7', stroke: '#22c55e' },
  core:     { label: 'Core Models',       color: '#e0f2fe', stroke: '#0ea5e9' },
  storage:  { label: 'Storage',           color: '#fce7f3', stroke: '#ec4899' },
  schema:   { label: 'Schemas / Entities', color: '#f1f5f9', stroke: '#64748b' },
};

const CONN_TYPES = {
  'data-flow':  { label: 'Data Flow',      color: '#3b82f6', dash: '' },
  'call':       { label: 'Function Call',   color: '#10b981', dash: '6,3' },
  'pipeline':   { label: 'Pipeline Stage',  color: '#f97316', dash: '8,4' },
  'registry':   { label: 'Registry Lookup', color: '#a855f7', dash: '4,4' },
  'depends':    { label: 'Dependency',      color: '#6b7280', dash: '2,2' },
};

const nodes = [
  // UI Layer (y ~40)
  { id: 'app',            label: 'VLMX App',           subtitle: 'ui/app.py',                               x: 80,  y: 40, w: 120, h: 44, layer: 'ui' },
  { id: 'main-screen',    label: 'MainScreen',          subtitle: 'ui/screens/main/main_screen.py',          x: 230, y: 40, w: 130, h: 44, layer: 'ui' },
  { id: 'cmd-block',      label: 'CommandBlock',         subtitle: 'ui/widgets/command_block.py',             x: 390, y: 40, w: 140, h: 44, layer: 'ui' },
  { id: 'form-wizard-ui', label: 'FormWizardScreen',     subtitle: 'ui/screens/modal/form_wizard_screen.py',  x: 560, y: 40, w: 155, h: 44, layer: 'ui' },
  { id: 'entity-mgr',     label: 'DynamicEntityMgr',     subtitle: 'ui/widgets/dynamic_entity_manager.py',    x: 745, y: 40, w: 155, h: 44, layer: 'ui' },
  { id: 'formatters',     label: 'Formatters',           subtitle: 'ui/formatters/results.py',                x: 930, y: 40, w: 110, h: 44, layer: 'ui' },

  // Engine Layer (y ~130)
  { id: 'executor',       label: 'CommandExecutor',      subtitle: 'engine/executor.py',                      x: 140, y: 130, w: 160, h: 44, layer: 'engine' },
  { id: 'router',         label: 'Router',               subtitle: 'engine/router.py',                        x: 370, y: 130, w: 120, h: 44, layer: 'engine' },
  { id: 'crud',           label: 'CRUD Handlers',        subtitle: 'engine/handlers/crud.py',                 x: 540, y: 130, w: 145, h: 44, layer: 'engine' },
  { id: 'nav-handler',    label: 'Nav Handler',          subtitle: 'engine/handlers/navigation.py',           x: 720, y: 130, w: 130, h: 44, layer: 'engine' },
  { id: 'wizard-handler', label: 'Wizard Handler',       subtitle: 'engine/handlers/wizard.py',               x: 890, y: 130, w: 140, h: 44, layer: 'engine' },
  { id: 'apps-handler',   label: 'Apps Handler',         subtitle: 'engine/handlers/apps.py',                 x: 1065, y: 130, w: 130, h: 44, layer: 'engine' },

  // Parser Pipeline Layer (y ~230)
  { id: 'parser',         label: 'Parser',               subtitle: 'dsl/parser/parser.py',                    x: 60,  y: 230, w: 100, h: 44, layer: 'parser' },
  { id: 'normalizer',     label: 'Normalizer',           subtitle: 'dsl/parser/normalizer.py',                x: 185, y: 230, w: 115, h: 44, layer: 'parser' },
  { id: 'tokenizer',      label: 'Tokenizer',            subtitle: 'dsl/parser/tokenizer.py',                 x: 320, y: 230, w: 110, h: 44, layer: 'parser' },
  { id: 'classifier',     label: 'Classifier',           subtitle: 'dsl/parser/classifier.py',                x: 450, y: 230, w: 110, h: 44, layer: 'parser' },
  { id: 'recognizer',     label: 'Recognizer',           subtitle: 'dsl/parser/recognizer.py',                x: 580, y: 230, w: 115, h: 44, layer: 'parser' },
  { id: 'interpreter',    label: 'Interpreter',          subtitle: 'dsl/parser/interpreter.py',               x: 715, y: 230, w: 120, h: 44, layer: 'parser' },
  { id: 'splitter',       label: 'Splitter',             subtitle: 'dsl/parser/splitter.py',                  x: 855, y: 230, w: 100, h: 44, layer: 'parser' },
  { id: 'filter-parser',  label: 'Filter',               subtitle: 'dsl/parser/filter.py',                    x: 975, y: 230, w: 100, h: 44, layer: 'parser' },
  { id: 'diagnostics',    label: 'Diagnostics',          subtitle: 'diag/validator.py',                       x: 1100, y: 230, w: 115, h: 44, layer: 'parser' },

  // IR / Words Layer (y ~330)
  { id: 'ir-command',     label: 'IRCommand',            subtitle: 'dsl/ir/command.py',                       x: 120, y: 330, w: 120, h: 44, layer: 'ir' },
  { id: 'lowering',       label: 'Lowering',             subtitle: 'dsl/ir/lowering.py',                      x: 280, y: 330, w: 110, h: 44, layer: 'ir' },
  { id: 'registry',       label: 'Word Registry',        subtitle: 'dsl/words/registry.py',                   x: 440, y: 330, w: 140, h: 44, layer: 'ir' },
  { id: 'actions-dsl',    label: 'Action Words',         subtitle: 'dsl/words/actions.py',                    x: 620, y: 330, w: 130, h: 44, layer: 'ir' },
  { id: 'generator',      label: 'Word Generator',       subtitle: 'dsl/words/generator.py',                  x: 790, y: 330, w: 140, h: 44, layer: 'ir' },
  { id: 'macros',          label: 'Macros',               subtitle: 'dsl/words/macros.py',                     x: 970, y: 330, w: 100, h: 44, layer: 'ir' },
  { id: 'filter-ast',     label: 'Filter AST',           subtitle: 'dsl/ast/filters.py',                      x: 1100, y: 330, w: 110, h: 44, layer: 'ir' },

  // Core Models Layer (y ~430)
  { id: 'context-model',  label: 'Context',              subtitle: 'core/models/context.py',                  x: 100, y: 430, w: 110, h: 44, layer: 'core' },
  { id: 'words-model',    label: 'Word Models',          subtitle: 'core/models/words.py',                    x: 250, y: 430, w: 125, h: 44, layer: 'core' },
  { id: 'token-models',   label: 'Token Models',         subtitle: 'core/models/parser/',                     x: 410, y: 430, w: 130, h: 44, layer: 'core' },
  { id: 'response-models',label: 'Response Models',      subtitle: 'core/models/responses/',                  x: 580, y: 430, w: 145, h: 44, layer: 'core' },
  { id: 'validation-models',label: 'Validation',         subtitle: 'core/models/validation/',                 x: 760, y: 430, w: 120, h: 44, layer: 'core' },
  { id: 'enums',          label: 'Enums',                subtitle: 'core/enums/',                              x: 920, y: 430, w: 100, h: 44, layer: 'core' },
  { id: 'constants',      label: 'Constants',            subtitle: 'core/constants.py',                        x: 1060, y: 430, w: 110, h: 44, layer: 'core' },

  // Storage Layer (y ~530)
  { id: 'storage-iface',  label: 'StorageInterface',     subtitle: 'db/database.py',                          x: 180, y: 530, w: 155, h: 44, layer: 'storage' },
  { id: 'json-backend',   label: 'JSON Backend',         subtitle: 'db/json_backend.py',                      x: 390, y: 530, w: 135, h: 44, layer: 'storage' },
  { id: 'sqlite-backend', label: 'SQLite Backend',       subtitle: 'db/sqlite_backend.py',                    x: 570, y: 530, w: 140, h: 44, layer: 'storage' },
  { id: 'storage-filters',label: 'DB Filters',           subtitle: 'db/filters.py',                           x: 755, y: 530, w: 115, h: 44, layer: 'storage' },
  { id: 'storage-maps',   label: 'Mappings',             subtitle: 'db/mappings.py',                          x: 910, y: 530, w: 110, h: 44, layer: 'storage' },
  { id: 'db-paths',       label: 'Paths',                subtitle: 'db/paths.py',                             x: 1065, y: 530, w: 100, h: 44, layer: 'storage' },

  // Schema Layer (y ~630)
  { id: 'entity-base',    label: 'EntityModel',          subtitle: 'core/schemas/base.py',                    x: 200, y: 630, w: 130, h: 44, layer: 'schema' },
  { id: 'schema-base',    label: 'SchemaModel',          subtitle: 'core/schemas/base.py',                    x: 400, y: 630, w: 130, h: 44, layer: 'schema' },
  { id: 'company-db',     label: 'CompanyDatabase',      subtitle: 'core/schemas/company.py',                 x: 600, y: 630, w: 155, h: 44, layer: 'schema' },
  { id: 'json-files',     label: 'JSON Files',           subtitle: 'data/{company}/*.json',                   x: 830, y: 630, w: 120, h: 44, layer: 'schema' },
];

const connections = [
  // UI internal
  { from: 'app', to: 'main-screen', type: 'call', label: 'mount' },
  { from: 'main-screen', to: 'cmd-block', type: 'call', label: 'render' },
  { from: 'main-screen', to: 'form-wizard-ui', type: 'call', label: 'open modal' },
  { from: 'main-screen', to: 'entity-mgr', type: 'call', label: 'open modal' },
  { from: 'main-screen', to: 'formatters', type: 'call', label: 'format result' },

  // UI → Engine
  { from: 'cmd-block', to: 'executor', type: 'data-flow', label: 'user input' },
  { from: 'form-wizard-ui', to: 'executor', type: 'data-flow', label: 'wizard data' },

  // Engine: executor flow
  { from: 'executor', to: 'parser', type: 'call', label: 'parse()' },
  { from: 'executor', to: 'lowering', type: 'call', label: 'tokens → IR' },
  { from: 'executor', to: 'router', type: 'data-flow', label: 'IRCommand' },

  // Engine: router → handlers
  { from: 'router', to: 'crud', type: 'call', label: 'dispatch' },
  { from: 'router', to: 'nav-handler', type: 'call', label: 'dispatch' },
  { from: 'router', to: 'wizard-handler', type: 'call', label: 'dispatch' },
  { from: 'router', to: 'apps-handler', type: 'call', label: 'dispatch' },

  // Parser pipeline (stages 0-6)
  { from: 'parser', to: 'normalizer', type: 'pipeline', label: 'stage 0' },
  { from: 'normalizer', to: 'tokenizer', type: 'pipeline', label: 'stage 1' },
  { from: 'tokenizer', to: 'classifier', type: 'pipeline', label: 'stage 2' },
  { from: 'classifier', to: 'recognizer', type: 'pipeline', label: 'stage 3' },
  { from: 'recognizer', to: 'interpreter', type: 'pipeline', label: 'stage 4' },
  { from: 'interpreter', to: 'splitter', type: 'pipeline', label: 'stage 5' },
  { from: 'splitter', to: 'filter-parser', type: 'pipeline', label: 'stage 6' },
  { from: 'parser', to: 'diagnostics', type: 'data-flow', label: 'validation' },

  // Parser ↔ Words (registry lookups)
  { from: 'recognizer', to: 'registry', type: 'registry', label: 'word lookup' },
  { from: 'interpreter', to: 'registry', type: 'registry', label: 'fuzzy match' },
  { from: 'normalizer', to: 'macros', type: 'registry', label: 'expand' },

  // IR layer
  { from: 'lowering', to: 'ir-command', type: 'data-flow', label: 'produces' },
  { from: 'lowering', to: 'registry', type: 'registry', label: 'word lookup' },
  { from: 'filter-parser', to: 'filter-ast', type: 'data-flow', label: 'produces' },

  // Words internal
  { from: 'actions-dsl', to: 'registry', type: 'data-flow', label: 'registers' },
  { from: 'generator', to: 'registry', type: 'data-flow', label: 'auto-gen words' },
  { from: 'generator', to: 'company-db', type: 'depends', label: 'reads schemas' },

  // Handlers → Storage
  { from: 'crud', to: 'storage-iface', type: 'call', label: 'CRUD ops' },
  { from: 'crud', to: 'storage-filters', type: 'call', label: 'apply filters' },
  { from: 'nav-handler', to: 'storage-iface', type: 'call', label: 'load org' },

  // Handlers → Models
  { from: 'crud', to: 'response-models', type: 'data-flow', label: 'CommandResult' },
  { from: 'wizard-handler', to: 'response-models', type: 'data-flow', label: 'FormRequest' },
  { from: 'nav-handler', to: 'context-model', type: 'data-flow', label: 'new Context' },
  { from: 'router', to: 'response-models', type: 'data-flow', label: 'HandlerResult' },

  // Results back to UI
  { from: 'crud', to: 'main-screen', type: 'data-flow', label: 'CommandResult' },
  { from: 'wizard-handler', to: 'form-wizard-ui', type: 'data-flow', label: 'FormRequest' },

  // Storage internal
  { from: 'storage-iface', to: 'json-backend', type: 'call', label: 'default' },
  { from: 'storage-iface', to: 'sqlite-backend', type: 'call', label: 'optional' },
  { from: 'json-backend', to: 'db-paths', type: 'depends', label: 'file paths' },
  { from: 'json-backend', to: 'json-files', type: 'data-flow', label: 'read/write' },
  { from: 'storage-maps', to: 'entity-base', type: 'depends', label: 'entity map' },
  { from: 'storage-maps', to: 'company-db', type: 'depends', label: 'table list' },

  // Schema internal
  { from: 'company-db', to: 'entity-base', type: 'depends', label: 'extends' },
  { from: 'company-db', to: 'schema-base', type: 'depends', label: 'extends' },

  // Core cross-refs
  { from: 'registry', to: 'words-model', type: 'depends', label: 'word types' },
  { from: 'token-models', to: 'words-model', type: 'depends', label: 'uses' },
  { from: 'diagnostics', to: 'validation-models', type: 'depends', label: 'issues' },
  { from: 'executor', to: 'context-model', type: 'depends', label: 'context' },
];

const PRESETS = {
  'full':     { label: 'Full System',      layers: Object.keys(LAYERS), conns: Object.keys(CONN_TYPES) },
  'command':  { label: 'Command Flow',     layers: ['ui', 'engine', 'ir', 'storage'],          conns: ['data-flow', 'call'] },
  'parsing':  { label: 'Parser Pipeline',  layers: ['parser', 'ir', 'core'],                    conns: ['pipeline', 'registry', 'data-flow'] },
  'data':     { label: 'Data & Storage',   layers: ['engine', 'storage', 'schema', 'core'],     conns: ['call', 'data-flow', 'depends'] },
  'dsl':      { label: 'DSL Vocabulary',   layers: ['ir', 'core', 'schema'],                    conns: ['data-flow', 'depends', 'registry'] },
};

// ── State ─────────────────────────────────────────────

const state = {
  layers: Object.fromEntries(Object.keys(LAYERS).map(k => [k, true])),
  connTypes: Object.fromEntries(Object.keys(CONN_TYPES).map(k => [k, true])),
  comments: [],
  activePreset: 'full',
  zoom: 1,
  panX: 0, panY: 0,
  dragging: false, dragStart: null,
};

// ── Render Controls ───────────────────────────────────

function renderPresets() {
  const el = document.getElementById('presets');
  el.innerHTML = Object.entries(PRESETS).map(([k, v]) =>
    `<button class="preset-btn ${state.activePreset === k ? 'active' : ''}" onclick="applyPreset('${k}')">${v.label}</button>`
  ).join('');
}

function renderLayers() {
  const el = document.getElementById('layers');
  el.innerHTML = Object.entries(LAYERS).map(([k, v]) =>
    `<label class="check-row"><input type="checkbox" ${state.layers[k] ? 'checked' : ''} onchange="toggleLayer('${k}', this.checked)"><span class="color-dot" style="background:${v.color};border:1px solid ${v.stroke}"></span>${v.label}</label>`
  ).join('');
}

function renderConnTypes() {
  const el = document.getElementById('connTypes');
  el.innerHTML = Object.entries(CONN_TYPES).map(([k, v]) =>
    `<label class="check-row"><input type="checkbox" ${state.connTypes[k] ? 'checked' : ''} onchange="toggleConn('${k}', this.checked)"><span class="line-sample" style="background:${v.color}"></span>${v.label}</label>`
  ).join('');
}

function renderComments() {
  const el = document.getElementById('commentsList');
  document.getElementById('commentCount').textContent = state.comments.length;
  if (!state.comments.length) {
    el.innerHTML = '<div class="no-comments">Click a component to add feedback</div>';
    return;
  }
  el.innerHTML = state.comments.map((c, i) =>
    `<div class="comment-item"><span class="target">${c.targetLabel}</span> <span class="file">${c.targetFile}</span><button class="del-btn" onclick="deleteComment(${i})">&times;</button><div class="text">${esc(c.text)}</div></div>`
  ).join('');
}

function renderLegend() {
  const el = document.getElementById('legend');
  const items = Object.entries(LAYERS).filter(([k]) => state.layers[k]).map(([k, v]) =>
    `<div class="legend-item"><span class="color-dot" style="background:${v.color};border:1px solid ${v.stroke}"></span>${v.label}</div>`
  );
  el.innerHTML = items.join('');
}

// ── SVG Rendering ─────────────────────────────────────

function renderDiagram() {
  const svg = document.getElementById('svg');
  const visibleLayers = new Set(Object.keys(state.layers).filter(k => state.layers[k]));
  const visibleNodes = nodes.filter(n => visibleLayers.has(n.layer));
  const visibleIds = new Set(visibleNodes.map(n => n.id));
  const visibleConns = connections.filter(c =>
    visibleIds.has(c.from) && visibleIds.has(c.to) && state.connTypes[c.type]
  );

  const commentedIds = new Set(state.comments.map(c => c.target));

  // Build SVG
  let defs = '<defs>';
  Object.entries(CONN_TYPES).forEach(([k, v]) => {
    defs += `<marker id="arrow-${k}" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="${v.color}"/></marker>`;
  });
  defs += '</defs>';

  let conns = visibleConns.map(c => {
    const fn = nodes.find(n => n.id === c.from);
    const tn = nodes.find(n => n.id === c.to);
    const ct = CONN_TYPES[c.type];
    const x1 = fn.x + fn.w / 2, y1 = fn.y + fn.h;
    const x2 = tn.x + tn.w / 2, y2 = tn.y;

    // Use side connections for same-row nodes
    let path;
    if (Math.abs(fn.y - tn.y) < 20) {
      const fromRight = fn.x < tn.x;
      const sx = fromRight ? fn.x + fn.w : fn.x;
      const sy = fn.y + fn.h / 2;
      const ex = fromRight ? tn.x : tn.x + tn.w;
      const ey = tn.y + tn.h / 2;
      const cp = Math.abs(ex - sx) * 0.4;
      path = `M${sx},${sy} C${sx + (fromRight?cp:-cp)},${sy} ${ex - (fromRight?cp:-cp)},${ey} ${ex},${ey}`;
    } else {
      const cp = Math.abs(y2 - y1) * 0.5;
      path = `M${x1},${y1} C${x1},${y1 + cp} ${x2},${y2 - cp} ${x2},${y2}`;
    }

    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const dashAttr = ct.dash ? ` stroke-dasharray="${ct.dash}"` : '';

    return `<path d="${path}" class="conn-line" stroke="${ct.color}" marker-end="url(#arrow-${c.type})"${dashAttr}/>` +
      (c.label ? `<text x="${mx}" y="${my - 4}" class="conn-label" text-anchor="middle">${c.label}</text>` : '');
  }).join('');

  let nodesSvg = visibleNodes.map(n => {
    const layer = LAYERS[n.layer];
    const commented = commentedIds.has(n.id);
    const strokeColor = commented ? '#f59e0b' : layer.stroke;
    const strokeW = commented ? 2.5 : 1.5;
    return `<g onclick="openModal('${n.id}')" style="cursor:pointer">` +
      `<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" fill="${layer.color}" stroke="${strokeColor}" stroke-width="${strokeW}" class="node-rect"/>` +
      `<text x="${n.x + n.w/2}" y="${n.y + 18}" class="node-label" text-anchor="middle">${n.label}</text>` +
      `<text x="${n.x + n.w/2}" y="${n.y + 32}" class="node-sub" text-anchor="middle">${n.subtitle}</text>` +
      `</g>`;
  }).join('');

  svg.innerHTML = `<g transform="translate(${state.panX},${state.panY}) scale(${state.zoom})">${defs}${conns}${nodesSvg}</g>`;
}

// ── Interactions ──────────────────────────────────────

function applyPreset(key) {
  state.activePreset = key;
  const preset = PRESETS[key];
  Object.keys(state.layers).forEach(k => state.layers[k] = preset.layers.includes(k));
  if (preset.conns) {
    Object.keys(state.connTypes).forEach(k => state.connTypes[k] = preset.conns.includes(k));
  }
  updateAll();
}

function toggleLayer(key, val) {
  state.layers[key] = val;
  state.activePreset = '';
  updateAll();
}

function toggleConn(key, val) {
  state.connTypes[key] = val;
  state.activePreset = '';
  updateAll();
}

let modalNodeId = null;

function openModal(nodeId) {
  const node = nodes.find(n => n.id === nodeId);
  if (!node) return;
  modalNodeId = nodeId;
  document.getElementById('modalTitle').textContent = node.label;
  document.getElementById('modalFile').textContent = 'src/vlmx_sh2/' + node.subtitle;
  document.getElementById('modalText').value = '';
  document.getElementById('modal').classList.add('show');
  setTimeout(() => document.getElementById('modalText').focus(), 50);
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  modalNodeId = null;
}

function saveComment() {
  const text = document.getElementById('modalText').value.trim();
  if (!text) { closeModal(); return; }
  const node = nodes.find(n => n.id === modalNodeId);
  state.comments.push({
    id: Date.now(),
    target: modalNodeId,
    targetLabel: node.label,
    targetFile: 'src/vlmx_sh2/' + node.subtitle,
    text
  });
  closeModal();
  updateAll();
}

function deleteComment(idx) {
  state.comments.splice(idx, 1);
  updateAll();
}

function zoom(factor) {
  state.zoom = Math.max(0.3, Math.min(3, state.zoom * factor));
  renderDiagram();
}

function resetZoom() {
  state.zoom = 1; state.panX = 0; state.panY = 0;
  renderDiagram();
}

// Pan with mouse drag
const canvas = document.getElementById('canvasArea');
canvas.addEventListener('pointerdown', e => {
  if (e.target.closest('g[onclick]')) return;
  state.dragging = true;
  state.dragStart = { x: e.clientX - state.panX, y: e.clientY - state.panY };
  canvas.style.cursor = 'grabbing';
});
window.addEventListener('pointermove', e => {
  if (!state.dragging) return;
  state.panX = e.clientX - state.dragStart.x;
  state.panY = e.clientY - state.dragStart.y;
  renderDiagram();
});
window.addEventListener('pointerup', () => {
  state.dragging = false;
  canvas.style.cursor = '';
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoom(e.deltaY < 0 ? 1.1 : 1/1.1);
}, { passive: false });

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// ── Prompt ────────────────────────────────────────────

function updatePrompt() {
  const el = document.getElementById('promptText');
  const visibleLayerNames = Object.entries(state.layers).filter(([,v]) => v).map(([k]) => LAYERS[k].label);
  const allVisible = visibleLayerNames.length === Object.keys(LAYERS).length;

  let parts = [];
  parts.push(`This is the VLMX-SH2 architecture — a DSL shell for managing business entities through natural language commands.`);

  if (!allVisible && visibleLayerNames.length > 0) {
    parts.push(`Currently viewing: ${visibleLayerNames.join(', ')}.`);
  }

  // Layer-specific summaries
  const summaries = [];
  if (state.layers.ui) summaries.push('The UI uses Textual (Python TUI) with MainScreen for command input, FormWizardScreen for modal forms, and DynamicEntityManager for split-screen editing.');
  if (state.layers.engine) summaries.push('The engine has a CommandExecutor that parses input, lowers to IR, and dispatches via Router to handlers (CRUD, navigation, wizard, apps).');
  if (state.layers.parser) summaries.push('The parser runs a 7-stage pipeline: normalize (macros) → tokenize → classify → recognize (word lookup) → interpret (fuzzy match) → split (cmd/filter) → filter AST.');
  if (state.layers.ir) summaries.push('IRCommand is the stable JSON-serializable contract between parser and engine. Words are auto-generated from schemas via the registry. Lowering converts parsed tokens to IR.');
  if (state.layers.core) summaries.push('Core models include Context (SYS/ORG/APP hierarchy), Word types, Token models, Response types (CommandResult, FormRequest, PickerRequest), and Validation.');
  if (state.layers.storage) summaries.push('Storage uses a pluggable backend (JSON default, SQLite optional) with per-entity JSON files organized by company folder.');
  if (state.layers.schema) summaries.push('Schemas define EntityModel/SchemaModel base classes. CompanyDatabase has 9 entities across core/branding/market modules (Organization, Brand, Offering, etc.).');
  if (summaries.length > 0) parts.push('\n' + summaries.join('\n'));

  if (state.comments.length) {
    parts.push('\nFeedback on specific components:\n');
    state.comments.forEach(c => {
      parts.push(`**${c.targetLabel}** (${c.targetFile}):\n${c.text}\n`);
    });
  }

  el.textContent = state.comments.length || !allVisible ? parts.join('\n') : 'Adjust layers and add comments to generate a prompt.';
}

function copyPrompt() {
  const text = document.getElementById('promptText').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
  });
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Init ──────────────────────────────────────────────

function updateAll() {
  renderPresets();
  renderLayers();
  renderConnTypes();
  renderComments();
  renderLegend();
  renderDiagram();
  updatePrompt();
}

updateAll();
</script>
</body>
</html>
